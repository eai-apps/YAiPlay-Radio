# Только ручной запуск. По умолчанию формирует пост в логах и ничего не отправляет.
name: YAi Radio — Telegram (dry-run)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Режим подготовки поста
        type: choice
        options: [station, day, news, webcam, release, ask, promo, feature, showcase]
        default: station

permissions:
  contents: read

concurrency:
  group: yaiplay-radio-telegram
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Библиотека изображений
        run: npm install --no-save --no-package-lock sharp@0.34.4
      - name: Подготовить пост
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY_RUN: "true"
        run: node scripts/telegram-post.mjs "${{ inputs.mode }}"
