name: Публикация сервера (Worker)
# Сервер yaiplay-radio-api: при изменении папки worker/ или вручную (Actions → «Публикация сервера (Worker)» → Run workflow).
on:
  push:
    branches: [main]
    paths: ['worker/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверка кода
        run: node --check worker/index.js
      - name: Публикация (секреты Worker не меняются)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Нет CLOUDFLARE_API_TOKEN"; exit 1; fi
          npx --yes wrangler@4 deploy
      - name: Проверка /health и /content
        run: |
          curl -fsS https://yaiplay-radio-api.yai-media-player.workers.dev/health
          echo
          curl -fsS https://yaiplay-radio-api.yai-media-player.workers.dev/content
